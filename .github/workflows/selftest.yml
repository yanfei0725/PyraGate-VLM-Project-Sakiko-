name: cpu-selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch + safetensors
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install safetensors
      - name: Structure selftest (139 checks, pure CPU)
        run: |
          cd model
          python selftest_uvit3d.py
      - name: Distill loss selftest
        run: python model/distill_loss.py
      - name: Quant plan selftest
        run: python model/quant_plan.py
      - name: Ablation matrix selftest
        run: python model/ablation_matrix.py
      - name: Engineering hygiene selftest
        run: python model/engineering_hygiene.py
